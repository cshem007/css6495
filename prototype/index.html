<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<title>CSS Design</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a CAD workspace. Toolbar on top, browser (parameters + features) left, 3D view centre, properties right, timeline at the bottom. */
:root {
  --bg: #eef1f5; --panel: #ffffff; --ink: #172030; --muted: #5d6879; --line: #d5dbe4; --soft: #e6eaf0;
  --accent: #1f6feb; --accent-soft: #dde9fd; --cut: #c2410c; --cut-soft: #fde7da; --ok: #1d7a4c; --err: #b42318; --err-soft: #fde4e1;
  --view: #f7f8fa; --wood: #c9a16b; --edge: #3b4556; --gridc: #c5ccd6;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10151c; --panel: #171e28; --ink: #e4e8ee; --muted: #97a1b0; --line: #2a3443; --soft: #1f2734;
  --accent: #6aa4ff; --accent-soft: #1b2b45; --cut: #ff9257; --cut-soft: #3b2214; --ok: #5cc690; --err: #ff8a7d; --err-soft: #3d1c1a;
  --view: #1a212c; --wood: #b88d57; --edge: #0d1117; --gridc: #313b4a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10151c; --panel: #171e28; --ink: #e4e8ee; --muted: #97a1b0; --line: #2a3443; --soft: #1f2734;
  --accent: #6aa4ff; --accent-soft: #1b2b45; --cut: #ff9257; --cut-soft: #3b2214; --ok: #5cc690; --err: #ff8a7d; --err-soft: #3d1c1a;
  --view: #1a212c; --wood: #b88d57; --edge: #0d1117; --gridc: #313b4a; color-scheme: dark }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 13.5px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.label { font-family: var(--f-mono); font-size: .68rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.top { display: flex; align-items: center; gap: 10px; padding: 8px max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 600; letter-spacing: .02em; }
.brand b { color: var(--accent); }
#docname { border: 1px solid transparent; background: transparent; padding: 4px 6px; border-radius: 5px; width: 13rem; max-width: 40vw; font-weight: 500; }
#docname:hover, #docname:focus { border-color: var(--line); background: var(--bg); }
.tools { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }
.tb { border: 1px solid var(--line); background: var(--panel); padding: 5px 10px; border-radius: 6px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.tb:hover { border-color: var(--accent); }
.tb:disabled { opacity: .45; cursor: default; }
.tb.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.tb .ic { font-family: var(--f-mono); font-weight: 600; }
.spacer { flex: 1; }

.work { display: grid; grid-template-columns: 260px minmax(0, 1fr) 290px; min-height: 0; }
@media (max-width: 980px) { .work { grid-template-columns: 1fr; grid-auto-rows: auto; overflow: auto; } .view { min-height: 58vh; } }
.side { background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 12px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.side.right { border-right: none; border-left: 1px solid var(--line); }
@media (max-width: 980px) { .side { border: none; border-bottom: 1px solid var(--line); } .side.right { border-left: none; } }
.sec { display: grid; gap: 6px; }
.sechead { display: flex; justify-content: space-between; align-items: center; }
.mini { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 1px 8px; cursor: pointer; font-size: .78rem; }
.mini:hover { border-color: var(--accent); }

.params { display: grid; gap: 4px; }
.prow { display: grid; grid-template-columns: minmax(0, 5.5rem) minmax(0, 1fr) 3.8rem 1.4rem; gap: 4px; align-items: center; }
.prow input { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 3px 6px; }
.prow input.bad, .field input.bad { border-color: var(--err); background: var(--err-soft); }
.prow .val { text-align: right; font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { border: none; background: none; color: var(--muted); cursor: pointer; padding: 0; font-size: 1rem; line-height: 1; }
.x:hover { color: var(--err); }

.tree { display: grid; gap: 2px; }
.titem { display: grid; grid-template-columns: 1.4rem minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 5px 6px; border-radius: 5px; cursor: pointer; border: 1px solid transparent; text-align: left; background: none; width: 100%; }
.titem:hover { background: var(--soft); }
.titem.sel { background: var(--accent-soft); border-color: var(--accent); }
.titem.skip { opacity: .5; }
.titem .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.glyph { font-family: var(--f-mono); font-weight: 600; text-align: center; border-radius: 4px; font-size: .8rem; line-height: 1.4rem; height: 1.4rem; background: var(--soft); }
.glyph.cut { background: var(--cut-soft); color: var(--cut); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); }

.view { position: relative; background: var(--view); min-width: 0; min-height: 0; overflow: hidden; }
#canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.vbar { position: absolute; top: 10px; right: 10px; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.vbar .tb { padding: 3px 8px; font-size: .8rem; background: var(--panel); }
.readout { position: absolute; left: 10px; bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; display: grid; gap: 1px; font-size: .78rem; max-width: calc(100% - 20px); }
.readout b { font-family: var(--f-mono); font-weight: 500; }
.toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 6px 12px; border-radius: 6px; font-size: .82rem; max-width: 80%; text-align: center; }

.props { display: grid; gap: 10px; }
.field { display: grid; grid-template-columns: 5.6rem minmax(0, 1fr); gap: 6px; align-items: center; }
.field input, .field select { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 4px; padding: 4px 7px; }
.field .hint { grid-column: 2; font-size: .74rem; color: var(--muted); margin-top: -4px; min-height: 1em; }
.field .hint.err { color: var(--err); }
.group { border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: none; background: var(--panel); padding: 4px 12px; cursor: pointer; border-left: 1px solid var(--line); }
.seg button:first-child { border-left: none; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.seg button.cut[aria-pressed="true"] { background: var(--cut); }
.empty { color: var(--muted); font-size: .86rem; }
.help { font-size: .8rem; color: var(--muted); display: grid; gap: 4px; }
.help code { font-family: var(--f-mono); background: var(--soft); padding: 0 4px; border-radius: 3px; }

.timeline { background: var(--panel); border-top: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 6px; align-items: center; overflow-x: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 3px 8px 3px 4px; cursor: pointer; white-space: nowrap; font-size: .8rem; }
.chip.sel { border-color: var(--accent); background: var(--accent-soft); }
.chip.skip { opacity: .45; text-decoration: line-through; }
.chip .glyph { width: 1.3rem; height: 1.3rem; line-height: 1.3rem; }
.arrow { color: var(--muted); }
#copybox { position: absolute; inset: auto 10px 10px auto; width: min(420px, calc(100% - 20px)); height: 140px; font-family: var(--f-mono); font-size: .75rem; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
</style>

<div class="app">
  <header class="top">
    <span class="brand"><b>CSS</b> Design</span>
    <label class="label" for="docname" style="position:absolute;left:-9999px">Design name</label><input id="docname" type="text" maxlength="60" aria-label="Design name">
    <div class="tools">
      <button class="tb" id="add-box" type="button" title="Add a box"><span class="ic">□</span>Box</button>
      <button class="tb" id="add-cyl" type="button" title="Add a cylinder"><span class="ic">○</span>Cylinder</button>
      <button class="tb" id="add-hole" type="button" title="Cut a round hole"><span class="ic" style="color:var(--cut)">⊖</span>Hole</button>
      <span class="sep"></span>
      <button class="tb" id="undo" type="button" title="Undo">↶ Undo</button>
      <button class="tb" id="redo" type="button" title="Redo">↷ Redo</button>
      <span class="sep"></span>
      <button class="tb" id="open" type="button" title="Open a design or a StarkWorkshop parts.json">Open file</button>
      <input id="file" type="file" accept=".json,application/json" hidden>
      <button class="tb" id="copy" type="button">Copy design</button>
      <button class="tb" id="sample" type="button">Reset to sample</button>
    </div>
    <span class="spacer"></span>
    <button class="tb primary" id="xr" type="button">View at real size</button>
  </header>

  <div class="work">
    <aside class="side" aria-label="Browser">
      <div class="sec">
        <div class="sechead"><span class="label">Parameters</span><button class="mini" id="add-param" type="button">+ Add</button></div>
        <div class="params" id="params"></div>
      </div>
      <div class="sec">
        <span class="label">Features (built top to bottom)</span>
        <div class="tree" id="tree"></div>
      </div>
      <div class="help">
        <span class="label">How it works</span>
        <span>Any size can be a number or a formula of parameters, like <code>width - 2*thick</code>.</span>
        <span>Change a parameter and every feature that uses it updates.</span>
        <span>Positions are the box's lower-left-back corner, in mm. Z is up.</span>
      </div>
    </aside>

    <main class="view" id="view">
      <canvas id="canvas" aria-label="3D view of the design"></canvas>
      <div class="vbar">
        <button class="tb" data-view="iso" type="button">Iso</button>
        <button class="tb" data-view="front" type="button">Front</button>
        <button class="tb" data-view="top" type="button">Top</button>
        <button class="tb" data-view="right" type="button">Right</button>
        <button class="tb" data-view="fit" type="button">Fit</button>
      </div>
      <div class="readout" id="readout"></div>
      <div class="toast" id="toast" hidden></div>
      <textarea id="copybox" hidden readonly aria-label="Design as text"></textarea>
    </main>

    <aside class="side right" aria-label="Properties">
      <span class="label">Properties</span>
      <div class="props" id="props"></div>
    </aside>
  </div>

  <footer class="timeline" id="timeline" aria-label="Timeline"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js" integrity="sha384-wagZhIFgY4hD+7awjQjR4e2E294y6J2HSnd8eTNc15ZubTeQeVRZwhQJ+W6hnBsf" crossorigin="anonymous"></script>
<script>
// CSS Design core: CSG (port of csg.js by Evan Wallace, MIT), a safe expression parser, and the
// parametric model evaluator. No DOM, no three.js: runs in the page and under node for tests.
(function (root) {
  // ---------------------------------------------------------------- CSG
  const EPS = 1e-5;
  const V = (x, y, z) => ({ x, y, z });
  const add = (a, b) => V(a.x + b.x, a.y + b.y, a.z + b.z), sub = (a, b) => V(a.x - b.x, a.y - b.y, a.z - b.z);
  const mul = (a, s) => V(a.x * s, a.y * s, a.z * s), dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
  const cross = (a, b) => V(a.y * b.z - a.z * b.y, a.z * b.x - a.x * b.z, a.x * b.y - a.y * b.x);
  const len = a => Math.sqrt(dot(a, a)), unit = a => { const l = len(a); return l > 0 ? mul(a, 1 / l) : a; };
  const lerp = (a, b, t) => add(a, mul(sub(b, a), t));

  function plane(a, b, c) { const n = cross(sub(b, a), sub(c, a)); const l = len(n); if (l < 1e-12) return null; const u = mul(n, 1 / l); return { n: u, w: dot(u, a) }; }
  const clonePlane = p => ({ n: V(p.n.x, p.n.y, p.n.z), w: p.w });
  const flipPlane = p => { p.n = mul(p.n, -1); p.w = -p.w; };
  function poly(verts, p) { p = p || plane(verts[0], verts[1], verts[2]); return p ? { v: verts, p } : null; }
  const clonePoly = q => ({ v: q.v.slice(), p: clonePlane(q.p) });
  const flipPoly = q => { q.v.reverse(); flipPlane(q.p); };

  function split(pl, q, cf, cb, f, b) {
    let type = 0; const types = [];
    for (const v of q.v) { const t = dot(pl.n, v) - pl.w; const ty = t < -EPS ? 2 : t > EPS ? 1 : 0; type |= ty; types.push(ty); }
    if (type === 0) (dot(pl.n, q.p.n) > 0 ? cf : cb).push(q);
    else if (type === 1) f.push(q);
    else if (type === 2) b.push(q);
    else {
      const fv = [], bv = [];
      for (let i = 0; i < q.v.length; i++) {
        const j = (i + 1) % q.v.length, ti = types[i], tj = types[j], vi = q.v[i], vj = q.v[j];
        if (ti !== 2) fv.push(vi);
        if (ti !== 1) bv.push(vi);
        if ((ti | tj) === 3) { const t = (pl.w - dot(pl.n, vi)) / dot(pl.n, sub(vj, vi)); const v = lerp(vi, vj, t); fv.push(v); bv.push(v); }
      }
      // Each half gets its own plane: flipping one must never flip the other.
      if (fv.length >= 3) f.push({ v: fv, p: clonePlane(q.p) });
      if (bv.length >= 3) b.push({ v: bv, p: clonePlane(q.p) });
    }
  }

  class Node {
    constructor(polys) { this.pl = null; this.f = null; this.b = null; this.polys = []; if (polys) this.build(polys); }
    invert() { this.polys.forEach(flipPoly); if (this.pl) flipPlane(this.pl); if (this.f) this.f.invert(); if (this.b) this.b.invert(); const t = this.f; this.f = this.b; this.b = t; }
    clip(list) { if (!this.pl) return list.slice(); let f = [], b = []; for (const q of list) split(this.pl, q, f, b, f, b); if (this.f) f = this.f.clip(f); b = this.b ? this.b.clip(b) : []; return f.concat(b); }
    clipTo(n) { this.polys = n.clip(this.polys); if (this.f) this.f.clipTo(n); if (this.b) this.b.clipTo(n); }
    all() { let a = this.polys.slice(); if (this.f) a = a.concat(this.f.all()); if (this.b) a = a.concat(this.b.all()); return a; }
    build(list) {
      if (!list.length) return;
      if (!this.pl) this.pl = clonePlane(list[0].p);
      const f = [], b = [];
      for (const q of list) split(this.pl, q, this.polys, this.polys, f, b);
      if (f.length) { if (!this.f) this.f = new Node(); this.f.build(f); }
      if (b.length) { if (!this.b) this.b = new Node(); this.b.build(b); }
    }
  }
  const cl = polys => polys.map(clonePoly);
  function union(A, B) { const a = new Node(cl(A)), b = new Node(cl(B)); a.clipTo(b); b.clipTo(a); b.invert(); b.clipTo(a); b.invert(); a.build(b.all()); return a.all(); }
  function subtract(A, B) { const a = new Node(cl(A)), b = new Node(cl(B)); a.invert(); a.clipTo(b); b.clipTo(a); b.invert(); b.clipTo(a); b.invert(); a.build(b.all()); a.invert(); return a.all(); }

  // Box from its MIN corner (x, y, z) and size (w along X, d along Y, h along Z). Z is up.
  function box(x, y, z, w, d, h) {
    const faces = [[[0, 4, 6, 2], -1], [[1, 3, 7, 5], 1], [[0, 1, 5, 4], -1], [[2, 6, 7, 3], 1], [[0, 2, 3, 1], -1], [[4, 5, 7, 6], 1]];
    const out = [];
    for (const [idx] of faces) {
      const vs = idx.map(i => V(x + w * (i & 1), y + d * ((i >> 1) & 1), z + h * ((i >> 2) & 1)));
      const p = poly(vs); if (p) out.push(p);
    }
    return out;
  }
  // Cylinder between two points with radius r.
  function cylinder(s, e, r, slices) {
    slices = slices || 40;
    const ray = sub(e, s), az = unit(ray), isY = Math.abs(az.y) > .5;
    const ax = unit(cross(V(isY ? 1 : 0, isY ? 0 : 1, 0), az)), ay = unit(cross(ax, az));
    const pt = (stack, t) => { const a = t * Math.PI * 2; const out = add(mul(ax, Math.cos(a)), mul(ay, Math.sin(a))); return add(add(s, mul(ray, stack)), mul(out, r)); };
    const res = [];
    for (let i = 0; i < slices; i++) {
      const t0 = i / slices, t1 = (i + 1) / slices;
      [poly([s, pt(0, t0), pt(0, t1)]), poly([pt(0, t1), pt(0, t0), pt(1, t0), pt(1, t1)]), poly([e, pt(1, t1), pt(1, t0)])].forEach(p => p && res.push(p));
    }
    return res;
  }
  // Watertight triangles: weld equal points, insert T-junction points into neighbouring edges, and
  // fan from each polygon's centroid. Same method as StarkWorkshop's Csg.ToWatertightTriangles. Without
  // it, edge lines show starbursts where a cut split one face but not its neighbour.
  function watertight(polys, weld) {
    weld = weld || 1e-4; const inv = 1 / weld, canon = new Map();
    const key = v => Math.round(v.x * inv) + ',' + Math.round(v.y * inv) + ',' + Math.round(v.z * inv);
    const C = v => { const k = key(v); let c = canon.get(k); if (!c) { c = v; canon.set(k, v); } return c; };
    const P = [];
    for (const q of polys) {
      const vs = [];
      for (const v of q.v) { const c = C(v); if (!vs.length || vs[vs.length - 1] !== c) vs.push(c); }
      if (vs.length > 1 && vs[0] === vs[vs.length - 1]) vs.pop();
      if (vs.length >= 3) P.push(vs);
    }
    const cell = 2, grid = new Map(), ck = (x, y, z) => x + '|' + y + '|' + z, cf = a => Math.floor(a / cell);
    for (const v of canon.values()) { const k = ck(cf(v.x), cf(v.y), cf(v.z)); let l = grid.get(k); if (!l) grid.set(k, l = []); l.push(v); }
    const onSeg = (a, b) => {
      const ab = sub(b, a), l2 = dot(ab, ab), out = []; if (l2 < weld * weld) return out;
      const x0 = cf(Math.min(a.x, b.x)) - 1, x1 = cf(Math.max(a.x, b.x)) + 1, y0 = cf(Math.min(a.y, b.y)) - 1, y1 = cf(Math.max(a.y, b.y)) + 1, z0 = cf(Math.min(a.z, b.z)) - 1, z1 = cf(Math.max(a.z, b.z)) + 1;
      for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++) {
        const l = grid.get(ck(x, y, z)); if (!l) continue;
        for (const p of l) { if (p === a || p === b) continue; const t = dot(sub(p, a), ab) / l2; if (t <= 1e-9 || t >= 1 - 1e-9) continue; if (len(sub(p, add(a, mul(ab, t)))) <= weld) out.push([t, p]); }
      }
      return out.sort((m, n) => m[0] - n[0]).map(m => m[1]);
    };
    const tris = [];
    for (const vs of P) {
      const o = []; let ins = false;
      for (let i = 0; i < vs.length; i++) { o.push(vs[i]); const extra = onSeg(vs[i], vs[(i + 1) % vs.length]); if (extra.length) { ins = true; o.push(...extra); } }
      if (!ins) { for (let i = 2; i < o.length; i++) tris.push([o[0], o[i - 1], o[i]]); continue; }
      let c = V(0, 0, 0); for (const v of o) c = add(c, v); c = mul(c, 1 / o.length);

      c.className = 'chip' + (f.id === selected ? ' sel' : '') + (f.skip ? ' skip' : '');
      c.innerHTML = glyph(f) + esc(f.name || 'Feature'); c.title = (f.skip ? 'Skipped. ' : '') + 'Double-click to skip or restore';
      c.addEventListener('click', () => select(f.id));
      c.addEventListener('dblclick', () => { f.skip = !f.skip; rebuild(true); checkpoint(); });
      t.appendChild(c);
    });
  }

  const FIELDS = {
    box: [['x', 'X'], ['y', 'Y'], ['z', 'Z'], ['w', 'Width (X)'], ['d', 'Depth (Y)'], ['h', 'Height (Z)']],
    cylinder: [['x', 'Start X'], ['y', 'Start Y'], ['z', 'Start Z'], ['r', 'Radius'], ['len', 'Length']]
  };
  function renderProps() {
    const f = model.features.find(x => x.id === selected), P = $('props');
    if (!f) { P.innerHTML = '<p class="empty">Select a feature in the list or the timeline to edit its sizes.</p>'; return; }
    const v = vars();
    let h = '<div class="field"><label for="pp-name">Name</label><input id="pp-name" value="' + esc(f.name || '') + '"></div>';
    h += '<div class="field"><span>Operation</span><span class="seg" role="group" aria-label="Operation"><button type="button" data-op="add" aria-pressed="' + (f.op !== 'cut') + '">Add</button><button type="button" class="cut" data-op="cut" aria-pressed="' + (f.op === 'cut') + '">Cut</button></span></div>';
    if (f.type === 'cylinder') h += '<div class="field"><label for="pp-axis">Direction</label><select id="pp-axis"><option value="x">Along X</option><option value="y">Along Y</option><option value="z">Along Z (up)</option></select></div>';
    h += '<div class="group"><span class="label">Position and size · mm</span>';
    FIELDS[f.type].forEach(([k, lab]) => { h += fieldHtml(f, k, lab, v); });
    h += '</div><div class="group"><span class="label">Repeat (pattern)</span>' + fieldHtml(f, 'count', 'Copies', v) + fieldHtml(f, 'sx', 'Step X', v) + fieldHtml(f, 'sy', 'Step Y', v) + fieldHtml(f, 'sz', 'Step Z', v) + '</div>';
    if (result.errors[f.id]) h += '<p class="hint err" style="margin:0">This feature is not built: ' + esc(result.errors[f.id]) + '</p>';
    h += '<div class="group" style="display:flex;gap:6px;flex-wrap:wrap"><button class="tb" id="pp-up" type="button">Move earlier</button><button class="tb" id="pp-down" type="button">Move later</button><button class="tb" id="pp-skip" type="button">' + (f.skip ? 'Restore' : 'Skip') + '</button><button class="tb" id="pp-del" type="button" style="color:var(--err)">Delete</button></div>';
    P.innerHTML = h;
    $('pp-name').addEventListener('input', e => { f.name = e.target.value; renderTree(); renderTimeline(); });
    $('pp-name').addEventListener('change', checkpoint);
    P.querySelectorAll('[data-op]').forEach(b => b.addEventListener('click', () => { f.op = b.dataset.op; rebuild(true); checkpoint(); }));
    if ($('pp-axis')) { $('pp-axis').value = f.axis || 'z'; $('pp-axis').addEventListener('change', e => { f.axis = e.target.value; rebuild(true); checkpoint(); }); }
    P.querySelectorAll('input[data-k]').forEach(inp => {
      inp.addEventListener('input', () => { f[inp.dataset.k] = inp.value; rebuild(false); refreshHints(f); });
      inp.addEventListener('change', checkpoint);
    });
    const idx = model.features.indexOf(f);
    $('pp-up').disabled = idx === 0; $('pp-down').disabled = idx === model.features.length - 1;
    $('pp-up').addEventListener('click', () => { model.features.splice(idx, 1); model.features.splice(idx - 1, 0, f); rebuild(true); checkpoint(); });
    $('pp-down').addEventListener('click', () => { model.features.splice(idx, 1); model.features.splice(idx + 1, 0, f); rebuild(true); checkpoint(); });
    $('pp-skip').addEventListener('click', () => { f.skip = !f.skip; rebuild(true); checkpoint(); });
    $('pp-del').addEventListener('click', () => { model.features.splice(idx, 1); fixSel(); rebuild(true); checkpoint(); });
  }
  function fieldHtml(f, k, lab, v) {
    const val = f[k] == null ? '' : f[k], r = String(val).trim() === '' ? { v: k === 'count' ? 1 : 0 } : evalOrErr(val, v);
    return '<div class="field"><label for="pp-' + k + '">' + lab + '</label><input id="pp-' + k + '" data-k="' + k + '" class="mono' + (r.e ? ' bad' : '') + '" value="' + esc(val) + '"' + (k === 'count' || k[0] === 's' ? ' placeholder="' + (k === 'count' ? '1' : '0') + '"' : '') + '><span class="hint' + (r.e ? ' err' : '') + '">' + (r.e ? esc(r.e) : (String(val).trim() && !/^-?\d*\.?\d+$/.test(String(val).trim()) ? '= ' + fmt(r.v) + (k === 'count' ? '' : ' mm') : '')) + '</span></div>';
  }
  function refreshHints(f) {
    const v = vars();
    $('props').querySelectorAll('input[data-k]').forEach(inp => {
      const k = inp.dataset.k, val = f[k] == null ? '' : f[k];
      const r = String(val).trim() === '' ? { v: 0 } : evalOrErr(val, v);
      inp.classList.toggle('bad', !!r.e);
      const hint = inp.nextElementSibling;
      hint.className = 'hint' + (r.e ? ' err' : '');
      hint.textContent = r.e ? r.e : (String(val).trim() && !/^-?\d*\.?\d+$/.test(String(val).trim()) ? '= ' + fmt(r.v) + (k === 'count' ? '' : ' mm') : '');
    });
  }

  function renderReadout() {
    const b = C.bounds(result.solid), errs = Object.keys(result.errors).length;
    if (!b) { $('readout').innerHTML = '<span>Nothing to show yet.</span>'; return; }
    const vol = C.volume(C.triangles(result.solid)) / 1000; // cm3
    $('readout').innerHTML = '<span>Overall <b>' + fmt(b.max.x - b.min.x) + ' × ' + fmt(b.max.y - b.min.y) + ' × ' + fmt(b.max.z - b.min.z) + ' mm</b></span>' +
      '<span>Volume <b>' + fmt(vol) + ' cm³</b> · in pine about <b>' + fmt(vol * .5 / 1000) + ' kg</b></span>' +
      (errs ? '<span style="color:var(--err)">' + errs + ' feature' + (errs > 1 ? 's' : '') + ' not built, see the red dot</span>' : '');
  }

  // ---------------------------------------------------------------- rebuild
  let pending = null, firstView = true;
  function rebuild(full) {
    result = C.build(model);
    drawBody(); drawGhost(); renderReadout(); renderTree(); renderTimeline();
    if (full) { renderParams(); renderProps(); $('docname').value = model.name || ''; }
    if (firstView && result.solid.length) { firstView = false; resize(); setView('iso'); }
    clearTimeout(pending); pending = setTimeout(save, 300);
  }
  function select(id) { selected = id; drawGhost(); renderTree(); renderTimeline(); renderProps(); }

  // ---------------------------------------------------------------- toolbar
  function newId() { let k = 1; while (model.features.find(f => f.id === 'f' + k)) k++; return 'f' + k; }
  function addFeature(f) { model.features.push(f); selected = f.id; rebuild(true); checkpoint(); }
  $('add-box').addEventListener('click', () => addFeature({ id: newId(), name: 'Box', type: 'box', op: 'add', x: '0', y: '0', z: '0', w: '100', d: '100', h: '100', count: '1', sx: '', sy: '', sz: '' }));
  $('add-cyl').addEventListener('click', () => addFeature({ id: newId(), name: 'Cylinder', type: 'cylinder', op: 'add', axis: 'z', x: '50', y: '50', z: '0', r: '25', len: '100', count: '1', sx: '', sy: '', sz: '' }));
  $('add-hole').addEventListener('click', () => addFeature({ id: newId(), name: 'Hole', type: 'cylinder', op: 'cut', axis: 'z', x: '50', y: '50', z: '-1', r: '2.5', len: '50', count: '1', sx: '', sy: '', sz: '' }));
  $('docname').addEventListener('input', e => { model.name = e.target.value; clearTimeout(pending); pending = setTimeout(save, 300); });
  $('docname').addEventListener('change', checkpoint);
  $('sample').addEventListener('click', () => { model = clone(SAMPLE); selected = model.features[0].id; rebuild(true); checkpoint(); setView('iso'); toast('Sample shelf loaded. Undo brings your design back.'); });
  $('open').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const j = JSON.parse(rd.result);
        if (Array.isArray(j.features)) { model = j; toast('Opened ' + (j.name || file.name) + '.'); }
        else if (Array.isArray(j.parts)) {
          const r = C.fromStarkParts(j); model = r.model; model.name = 'From headset: ' + file.name;
          toast('Opened from StarkWorkshop: ' + r.model.features.length + ' part(s) as features' + (r.skipped.length ? '. Skipped (not supported yet): ' + r.skipped.join(', ') : '.'));
        } else throw new Error('not a design or a parts.json');
        fixSel(); rebuild(true); checkpoint(); setView('iso');
      } catch (err) { toast('Could not open ' + file.name + ': ' + err.message); }
      e.target.value = '';
    };
    rd.readAsText(file);
  });
  $('copy').addEventListener('click', () => {
    const text = JSON.stringify(model, null, 1), box = $('copybox');
    const fallback = () => { box.hidden = false; box.value = text; box.focus(); box.select(); toast('Select all and copy the text in the box.'); };
    try { navigator.clipboard.writeText(text).then(() => { box.hidden = true; toast('Design copied. Paste it into a .json file or our chat.'); }, fallback); } catch (err) { fallback(); }
  });
  let tt = null;
  function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 5000); }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  applyTheme(); updateUndo(); fixSel(); rebuild(true); resize(); setView('iso');
})();
</script>

</body>
</html>
